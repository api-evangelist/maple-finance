name: Maple Finance
description: >-
  Maple Finance is an onchain asset management and institutional DeFi lending
  protocol launched in 2019 (Maple Labs Pty Ltd) that has facilitated over $23
  billion in loan originations. It offers digital-asset lending and yield
  products for individuals and institutions, including the syrupUSDC, syrupUSDT
  and syrupUSDG ERC-4626 vaults, institutional secured lending, and a cash
  management pool, spanning Ethereum mainnet and crosschain deployments (Solana,
  Arbitrum, Base, Plasma) via Chainlink CCIP. Maple's integration surface is
  onchain smart contracts plus the official @maplelabs/maple-js SDK, a GitBook
  documentation MCP server, and an extensive technical reference covering loans,
  pools, strategies, withdrawal managers, and the SYRUP token.
